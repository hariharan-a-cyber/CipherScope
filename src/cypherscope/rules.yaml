# Check catalog for CypherScope.
# Each entry defines the severity and title for a finding code.
# The detection logic lives in src/cypherscope/rules.py; this file lets you
# tune severity and wording without touching code.

NO_ENCRYPTION:
  severity: CRITICAL
  title: Session ran in cleartext

STARTTLS_STRIPPED:
  severity: CRITICAL
  title: STARTTLS offered but not used

OBSOLETE_TLS:
  severity: HIGH
  title: Obsolete TLS version negotiated

WEAK_CIPHER:
  severity: HIGH
  title: Weak cipher suite negotiated

CERT_EXPIRED:
  severity: HIGH
  title: Certificate expired or not yet valid

CERT_SELF_SIGNED:
  severity: MEDIUM
  title: Self-signed certificate

WEAK_KEY:
  severity: MEDIUM
  title: Weak public key

NO_FORWARD_SECRECY:
  severity: MEDIUM
  title: No forward secrecy
